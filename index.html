<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <title>Simulador de Empréstimo</title>
</head>
<body>

  <h2>Cadastrar Produto</h2>

  <input type="text" id="inputNome" placeholder="Nome do Produto">
  <br><br>
  <input type="number" id="inputPreco" placeholder="Preço (R$)">
  <br><br>

  <button id="btnSalvar">Salvar Produto</button>

  <h3 id="resultado">Nenhum produto cadastrado.</h3>

<script>
   
      const inputNome = document.getElementById("inputNome");
      const inputPreco = document.getElementById("inputPreco");
      const btnSalvar = document.getElementById("btnSalvar");
      const resultado = document.getElementById("resultado");

      function salvarProduto(){
        const produto = {
          nome: inputNome.value,
          preco: Number(inputPreco.value)
        };

        if(produto.nome === "" || produto.preco <= 0){
          resultado.innerText = "Preencha os dados corretamente!";
          return;
        }

        resultado.innerText = `Produto: ${produto.nome} | Preço: R$ ${produto.preco.toFixed(2)}`;
      }

      btnSalvar.addEventListener("click", salvarProduto);

</script>

</body>
</html>
