<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula JavaScript - Prática de Eventos DOM</title>

</head>
<body>
  
  <h2>DOM = Document Object!</h2>

  <input type="number" id="num1" placeholder="Número 1">
  +
  <input type="number" id="num2" placeholder="Número 2">

  <button id="btnCalcular">Somar</button>

  <h3 id="resultado">Resultado: 0</h3>

  <script>

      const campo1 = document.getElementById("num1");
      const campo2 = document.getElementById("num2");
      const botao = document.getElementById("btnCalcular");
      const textoResultado = document.getElementById("resultado");

      function somarValores(){
        const n1 = Number(campo1.value);
        const n2 = Number(campo2.value);

        const soma = n1 + n2;

        textoResultado.innerText = `Resultado: ${soma}`;
      }

      botao.addEventListener("click", somarValores);

  </script>
  
</body>
</html>
