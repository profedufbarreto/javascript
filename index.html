<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula JavaScript</title>

</head>
<body>
  
  <h1>Aula de JavaScript</h1>


  <script>

      function exibirAprovados(listaAlunos){
        listaAlunos.forEach(aluno => {
          if(aluno.nota >= 7.0){
            console.log(`${aluno.nome} foi aprovado(a) com nota ${aluno.nota}`);
          }
        });
      }

      const alunos = [
        {nome: "Ana", nota: 8.5},
        {nome: "Bruno", nota: 5.0},
        {nome: "Carla", nota: 7.0}
      ];

      exibirAprovados(alunos);

  </script>
  
</body>
</html>
