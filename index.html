<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript</title>

</head>
<body>

    <h3>Teste com nome</h3>

    <input type="text" id="name" placeholder="Digite o nome...">
    <button id="btnName">Name</button>

    <h4 id="txtName">Seu nome é: </h4>

<script>

    const name = document.getElementById("name");
    const btnName = document.getElementById("btnName");
    const txtName = document.getElementById("txtName");

    const exibirNome = () => {
      txtName.innerText = `Seu nome é: ${name.value}`;
    }

    btnName.addEventListener("click", exibirNome);


</script>
</body>
</html>
