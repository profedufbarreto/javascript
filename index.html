<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
</head>
<body>

<h2>The for Loop</h2>

<p id="demo"></p>

<script>
  let text = "";

  let i = 0;

  while(i < 10){
    text += "The number is " + i + "<br>";
    i++
  }

  document.getElementById("demo").innerHTML = text;

</script>

</body>
</html>
