  <h1>Aula 1: Variáveis e tipos de dados</h1>
  <p>Abra o Console (F12) para ver os resultados</p>

  <script>

      function somar(a, b){
        return a + b;
      }

      const soma = (a, b) => a + b;

      console.log(somar(4, 5));
      console.log(soma(5, 2));

  </script>
