<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript</title>

</head>
<body>

    <h2>Ajuste de Tamanho</h2>

    <input type="number" id="campoTamanho" placeholder="Digite um tamanho (ex: 30)">
    <button id="btnAplicar">Aplicar Tamanho</button>

    <h3 id="txtTexto">Esse texto vai mudar de tamanho!</h3>

<script>

    const campoTamanho = document.getElementById("campoTamanho");
    const btnAplicar = document.getElementById("btnAplicar");
    const txtTexto = document.getElementById("txtTexto");

      const alterarTamanho = () => {
        const tamanho = campoTamanho.value;

        if(tamanho === "" || tamanho <= 0){
          alert("Digite um número válido!");
          return;
        }

        txtTexto.style.fontSize = `${tamanho}px`;
      };

      btnAplicar.addEventListener("click", alterarTamanho);

</script>
</body>
</html>
