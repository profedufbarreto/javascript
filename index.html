<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula 1 - Js Básiso</title>

</head>
<body>

  <h1>Aula 1: Variáveis e tipos de dados</h1>
  <p>Abra o Console (F12) para ver os resultados</p>

  <script>

      var a = 1;
      let b = 2;
      const c = 3;

      if(true){
        var a = 10;
        b = 20;
        const c = 30;
      }

      console.log(a);
      console.log(b);
      console.log(c);

      //var aceita tanto reatribuição quanto a redeclaração
      //let aceita apenas a reatribuição
      //const não aceita nenhum dos dois


  </script>

  

</body>
</html>
