<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula JavaScript - Prática de Eventos DOM</title>

</head>
<body>
  
  <h2>DOM = Document Object!</h2>

  <input type="number" id="num1" placeholder="Número 1">
  <br><br>
  <input type="number" id="num2" placeholder="Número 2">


  <br><br>
  <button id="btnSomar">Somar</button>
  <br><br>
  <button id="btnSubtrair">Subtrair</button>
  <br><br>
  <button id="btnMultiplicar">Multiplicar</button>
  <br><br>
  <button id="btnDividir">Dividir</button>

  <h3 id="somar">Soma: 0</h3>
  <h3 id="subtrair">Subtração: 0</h3>
  <h3 id="multiplicar">Multiplicação: 0</h3>
  <h3 id="dividir">Divisão: 0</h3>

  <script>

      const campo1 = document.getElementById("num1");
      const campo2 = document.getElementById("num2");
      const botaoSomar = document.getElementById("btnSomar");
      const botaoSubtrair = document.getElementById("btnSubtrair");
      const botaoMultiplicar = document.getElementById("btnMultiplicar");
      const botaoDividir = document.getElementById("btnDividir");
      const textoSomar = document.getElementById("somar");
      const textoSubtrair = document.getElementById("subtrair");
      const textoMultiplicar = document.getElementById("multiplicar");
      const textoDividir = document.getElementById("dividir");


      function somarValores(){
        const n1 = Number(campo1.value);
        const n2 = Number(campo2.value);

        const soma = n1 + n2;

        textoSomar.innerText = `Resultado: ${soma}`;

      }

      function subtrairValores(){
        const n1 = Number(campo1.value);
        const n2 = Number(campo2.value);

        const subtrair = n1 - n2;

        textoSubtrair.innerText = `Resultado: ${subtrair}`;
      }

      function multiplicarValores(){
        const n1 = Number(campo1.value);
        const n2 = Number(campo2.value);

        const multiplicar = n1 * n2;

        textoMultiplicar.innerText = `Resultado: ${multiplicar}`;
      }

      function dividirValores(){
        const n1 = Number(campo1.value);
        const n2 = Number(campo2.value);

        const dividir = n1 / n2;

        textoDividir.innerText = `Resultado: ${dividir}`;
      }


      botaoSomar.addEventListener("click", somarValores);

      botaoSubtrair.addEventListener("click", subtrairValores);

      botaoMultiplicar.addEventListener("click", multiplicarValores);

      botaoDividir.addEventListener("click", dividirValores);

  </script>
  
</body>
</html>
