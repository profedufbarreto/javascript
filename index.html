<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
</head>
<body>

<h2>The for Loop</h2>

<p id="demo"></p>

<script>
  let text = "";

  for(let i = 0; i < 5; i++){
    text = text + "The number is " + i + "<br>";
  }

  document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
