  <script>

        {nome: "Miguel", sobrenome: "Arantes"},
        {nome: "Joana", sobrenome: "Dark"},
        {nome: "Paulo", sobrenome: "Raimundo"}

        return{

        };
      });

      console.log(nomesAlterados);

  </script>
