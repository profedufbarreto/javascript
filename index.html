  <h1>Aula 1: Variáveis e tipos de dados</h1>
  <p>Abra o Console (F12) para ver os resultados</p>

  <script>

      function predio(){
        if(true){
          var crachaVar = "Acesso liberado pelo VAR";
          let crachaLet = "Acesso liberado pelo LET";
        }

        console.log(crachaVar);
        console.log(crachaLet);

      }

      predio();

      //let não consegue sair de nenhum {}
      //enquanto o var consegue, ficando dentro da function

  </script>
