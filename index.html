<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
  <title>Avaliação de Aluno (POO)</title>

</head>
<body>

  <div class="card-container">
    <h2>Avaliação de Aluno</h2>

    <div class="grupo-input">
      <label for="campoNome">Nome do Aluno</label>
      <input type="text" id="campoNome" placeholder="Ex: Eduardo">
    </div>

    <div class="grupo-input">
      <label for="campoNota">Nota (0 a 10)</label>
      <input type="number" id="campoNota" min="0" max="10" placeholder="Ex: 8.5">
    </div>

    <div class="grupo-botoes">
      <button id="btnAvaliar">Avaliar Aluno</button>
    </div>

    <div class="resultado-box">
      <h3 id="txtResultado">Resultado: -</h3>
    </div>
  </div>

  <script>
    class Aluno {
      constructor(nome, nota) {
        this.nome = nome;
        this.nota = nota;
      }

      obterStatus() {
        if (this.nota >= 7) {
          return `${this.nome} foi APROVADO(A)!`;
        } else {
          return `${this.nome} foi REPROVADO(A).`;
        }
      }
    }

    const campoNome = document.getElementById("campoNome");
    const campoNota = document.getElementById("campoNota");
    const btnAvaliar = document.getElementById("btnAvaliar");
    const txtResultado = document.getElementById("txtResultado");

    function processar() {
      const nome = campoNome.value;
      const nota = Number(campoNota.value);

      if (nome === "" || campoNota.value === "") {
        txtResultado.innerText = "Preencha todos os campos!";
        return;
      }

      const aluno = new Aluno(nome, nota);
      txtResultado.innerText = aluno.obterStatus();
    }

    btnAvaliar.addEventListener("click", processar);
  </script>

</body>
</html>
