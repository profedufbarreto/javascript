<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação de Aluno (POO)</title>

</head>
<body>

    <h2>Simulador de Imposto por Categoria</h2>

    <input type="text" id="campoNome" placeholder="Nome do produto">
    <br><br>
    <input type="number" id="campoPreco" placeholder="Preço base (R$)">
    <br><br>

    <button id="btnAlimentos">Alimento (5% Imposto)</button>
    <button id="btnEletronicos">Eletrônico (15% Imposto)</button>
    <button id="btnLuxo">Luxo (30% Imposto)</button>

    <h3 id="txtResultado">Resultado: -</h3>

<script>

    class Produtos{
      #preco;

      constructor(nome, preco){
        this.nome = nome;
        this.#preco = preco;
      }

      calcularPrecoFinal(porcentagemImposto){
        const imposto = this.#preco * (porcentagemImposto / 100);
        const precoFinal = this.#preco + imposto;
        return `Produto: ${this.nome} | Preço Final (${porcentagemImposto}% imposto): R$ ${precoFinal.toFixed(2)}`;
      }
    }

    const campoNome = document.getElementById("campoNome");
    const campoPreco = document.getElementById("campoPreco");
    const txtResultado = document.getElementById("txtResultado");

    // 3. ARROW FUNCTION QUE PROCESSA O CÁLCULO
    const processarCalculo = (porcentagem) => {
      const nome = campoNome.value;
      const preco = Number(campoPreco.value);

      if (nome === "" || campoPreco.value === "" || preco <= 0) {
        txtResultado.innerText = "Preencha o nome e o preço corretamente!";
        return;
      }

      // Instancia o objeto da classe Produto
      const item = new Produto(nome, preco);

      // Atualiza a tela chamando o método da classe
      txtResultado.innerText = item.calcularPrecoFinal(porcentagem);
    };

    // 4. EVENTOS (Passando parâmetros via Arrow Function anônima)
    document.getElementById("btnAlimentos").addEventListener("click", () => processarCalculo(5));
    document.getElementById("btnEletronicos").addEventListener("click", () => processarCalculo(15));
    document.getElementById("btnLuxo").addEventListener("click", () => processarCalculo(30));


</script>
</body>
</html>
