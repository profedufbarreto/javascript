<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript</title>

</head>
<body>

    <h2>Troca de cor</h2>

    <input type="text" name="campoCor" id="campoCor" placeholder="Ex: red, blue, green, #ff0000">
    <button id="btnMudar">Mudar Cor</button>

    <h3 id="txtCaixa">Texto que vai mudar de cor!</h3>

<script>

    const campoCor = document.getElementById("campoCor");
    const btnMudar = document.getElementById("btnMudar");
    const txtCaixa = document.getElementById("txtCaixa");

    const alterarCor = () => {
      const corDigitada = campoCor.value;
      txtCaixa.style.color = corDigitada;
    };

    btnMudar.addEventListener("click", alterarCor);

</script>
</body>
</html>
