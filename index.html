<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula JavaScript</title>

</head>
<body>
  
  <h1>Aula de JavaScript</h1>


  <script>

      function somarTudo(...numeros){
        let total = 0;

        for(let i = 0; i < numeros.length; i++){
          total += numeros[i];
        }

        return total;
      }

      console.log(somarTudo(5, 10, 15));
      console.log(somarTudo(2, 4, 6, 8, 10));


  </script>
  
</body>
</html>
