<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>
  <style>
    
    #demo1{
      color: red;
    }

  </style>
</head>
<body>

  <h2>Testando coisas com DOM..</h2>

  <p id="demo"></p>
  <p id="demo1"></p>

  <script>

    document.getElementById("demo").innerHTML = "Olá mundo!";
    document.getElementById("demo1").innerHTML = "Meu nome é Eduardo!";

  </script>

</body>
</html>
