<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula JavaScript</title>

</head>
<body>
  
  <h1>Aula de JavaScript</h1>


  <script>

    function somar(a, b){
      return a + b;
    }


    const somarArrow = (a, b) => a + b;

    console.log(somar(10, 5));
    console.log(somarArrow(12, 4));

  </script>
  
</body>
</html>
