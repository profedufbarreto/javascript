<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação de Aluno (POO)</title>

</head>
<body>

    <h2>Conta Bancária Simples</h2>

    <h3 id="txtSaldo">Saldo Atual: R$ 0.00</h3>

    <input type="number" id="campoValor" placeholder="Valor (R$)">
    <br><br>

    <button id="btnDepositar">Depositar</button>
    <button id="btnSacar">Sacar</button>

    <p id="txtMensagem"></p>
  

<script>

    class ContaBancaria{
      constructor(saldoInicial){
        this.saldo = saldoInicial;
      }

      depositar(valor){
        if(valor <= 0) return "Valor de deposíto inválido!";
        this.saldo += valor;
        return `Depósito de R$ ${valor.toFixed(2)} realizado!`;
      }

      sacar(valor){
        if(valor <= 0) return "Valor de saque inválido!";
        if(valor > this.saldo) return "Saldo insuficiente!";
        this.saldo -= valor;
        return `Saque de R$ ${valor.toFixed(2)} realizado!`;
      }
    }

    const minhaConta = new ContaBancaria(100);

    const txtSaldo = document.getElementById("txtSaldo");
    const campoValor = document.getElementById("campoValor");
    const btnDepositar = document.getElementById("btnDepositar");
    const btnSacar = document.getElementById("btnSacar");
    const txtMensagem = document.getElementById("txtMensagem");

    txtSaldo.innerText = `Saldo Atual: R$ ${minhaConta.saldo.toFixed(2)}`;

    btnDepositar.addEventListener("click", () => {
      const valor = Number(campoValor.value);
      const mensagem = minhaConta.depositar(valor);

      txtMensagem.innerText = mensagem;
      txtSaldo.innerText = `Saldo Atual: R$ ${minhaConta.saldo.toFixed(2)}`;
      campoValor.value = "";
    });

    btnSacar.addEventListener("click", () => {
      const valor = Number(campoValor.value);
      const mensagem = minhaConta.sacar(valor);

      txtMensagem.innerText = mensagem;
      txtSaldo.innerText = `Saldo Atual: R$ ${minhaConta.saldo.toFixed(2)}`;
      campoValor.value = "";
    });

</script>
</body>
</html>
