<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript</title>

</head>
<body>

    <h3>Brincando um pouco!</h3>

    <input type="text" id="campoNome" placeholder="Digite seu nome aqui..">
    <br><br>
    <input type="text" id="campoSobrenome" placeholder="Digite seu sobrenome aqui..">
    <br><br>
    <button id="btnConcatenar">Concatenar</button>

    <h3 id="nomeCompleto">Seu nome é: </h3>

<script>

    const campoNome = document.getElementById("campoNome");
    const campoSobrenome = document.getElementById("campoSobrenome");
    const btnConcatenar = document.getElementById("btnConcatenar");
    const nomeCompleto = document.getElementById("nomeCompleto");

    function concatenar(){
      const nome = campoNome.value;
      const sobrenome = campoSobrenome.value;

      const resultado = `Seu nome é: ${nome} ${sobrenome}`;
      
      nomeCompleto.innerText = resultado;
    }

    btnConcatenar.addEventListener("click", concatenar);

</script>
</body>
</html>
