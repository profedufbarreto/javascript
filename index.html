<body>

  <h1>Aula 1: Variáveis e tipos de dados</h1>
  <p>Abra o Console (F12) para ver os resultados</p>

  <script>

      const produtos = [
        {nome: "Teclado", preco: 150},
        {nome: "Mouse", preco: 80},
        {nome: "Monitor", preco: 900}
      ];

      const produtosBaratos = produtos.filter((item) => {
        return item.preco <= 150;
      });

      console.log(produtosBaratos);

  </script>
