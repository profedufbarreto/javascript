<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula JavaScript - Prática de Eventos DOM</title>

</head>
<body>
  
  <h2>DOM = Document Object!</h2>

    <input type="number" id="campo-idade" min="0" max="120" placeholder="Digite sua idade: ">
    <br><br>

    <button id="btnVerificar">Verificar</button>

    <h3 id="txt-resultado">Resultado: -</h3>

  <script>

    const campoIdade = document.getElementById("campo-idade");
    const btnVerificar = document.getElementById("btnVerificar");
    const txtResultado = document.getElementById("txt-resultado");

      function verificarVoto(){
        const idade = Number(campoIdade.value);

        if(idade < 0 || campoIdade.value === ""){
          txtResultado.innerText = "Por favor, digite uma idade válida!";
          return;
        }

        if(idade < 16){
          txtResultado.innerText = "Resultado: Não pode votar.";
        }else if((idade >= 16 && idade <= 17) || idade >= 70){
          txtResultado.innerText = "Resultado: Voto opcional.";
        }else{
          txtResultado.innerText = "Resultado: Voto Obrigatório!";
        }

      }

      btnVerificar.addEventListener("click", verificarVoto);
      

  </script>
  
</body>
</html>
