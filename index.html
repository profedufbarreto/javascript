<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript</title>

</head>
<body>

    <h2>Monitor de Texto em tempo real</h2>

    <label for="campo-texto">Digite seu nome: </label>
    <input type="text" id="campo-texto" placeholder="Digite algo..">

    <h3 id="txt-preview">Você está digitando: -</h3>

<script>

    const campoTexto = document.querySelector("#campo-texto");
    const txtPreview = document.querySelector("#txt-preview");

    campoTexto.addEventListener("input", () => {
      const valor = campoTexto.value;

      if(valor.trim() === ""){
        txtPreview.innerText = "Você está digitando: -";
      }else{
        txtPreview.innerText = `Você está digitando: ${valor}`;
      }
    });

</script>
</body>
</html>
