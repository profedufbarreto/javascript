<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula JavaScript</title>

</head>
<body>
  
  <h1>Aula de JavaScript</h1>


  <script>

      const aplicarDesconto = (preco, desconto = 0.10) => {
        return preco - (preco * desconto);
      };

      console.log(aplicarDesconto(100));
      console.log(aplicarDesconto(100, 0.20));


  </script>
  
</body>
</html>
