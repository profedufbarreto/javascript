<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula JavaScript</title>

</head>
<body>
  
  <h1>Aula de JavaScript</h1>


  <script>

    function ehPar(numero){
      return numero % 2 === 0;
    }

    const ehParArrow = numero => numero % 2 === 0;

    console.log(ehPar(5));
    console.log(ehParArrow(3));

  </script>
  
</body>
</html>
