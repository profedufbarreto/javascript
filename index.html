<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula JavaScript</title>

</head>
<body>
  
  <h1>Aula de JavaScript</h1>


  <div id="caixaTexto"></div>
  <div id="caixaHtml"></div>

  <script>

      const caixaTexto = document.getElementById("caixaTexto");
      const caixaHtml = document.getElementById("caixaHtml");

      caixaTexto.innerText = "<h3>Mensagem como texto</h3>";

      caixaHtml.innerHTML = "<h3>Mensagem como cabeçalho!</h3>";

  </script>
  
</body>
</html>
