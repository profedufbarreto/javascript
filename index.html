<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <title>Simulador de Empréstimo</title>
</head>
<body>

  <h2>Perfil do usuário</h2>

  <button id="btnCarregar">Carregar Perfil</button>

  <p id="txtNome">Nome: -</p>
  <p id="txtCargo">Cargo: -</p>

<script>
   
      const usuario = {
        nome: "Eduardo",
        cargo: "Desenvolvedor"
      };

      const btn = document.getElementById("btnCarregar");
      const txtNome = document.getElementById("txtNome");
      const txtCargo = document.getElementById("txtCargo");

      function exibirPerfil(){
        txtNome.innerText = `Nome ${usuario.nome}`;
        txtCargo.innerText = `Cargo ${usuario.cargo}`;
      }

      btn.addEventListener("click", exibirPerfil);

</script>

</body>
</html>
