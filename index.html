<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula 1 - Js Básiso</title>

</head>
<body>

  <h1>Aula 1: Variáveis e tipos de dados</h1>
  <p>Abra o Console (F12) para ver os resultados</p>

  <script>

      function calcularImposto(valor){
        return valor * 0.15;
      }

      const calcularImpostoImplicito = (valor) => valor * 0.15;

      console.log(calcularImposto(400));
      console.log(calcularImpostoImplicito(400));

  </script>

  

</body>
</html>
