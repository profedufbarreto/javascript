<body>

  <h1>Aula 1: Variáveis e tipos de dados</h1>
  <p>Abra o Console (F12) para ver os resultados</p>

  <script>

      function mult(a, b){
        return a * b;
      }

      const multiplicar = (a, b) => (a * b);

      console.log(mult(3, 5));
      console.log(multiplicar(3, 3));

  </script>

  

</body>
