<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula JavaScript - Prática de Eventos DOM</title>

</head>
<body>
  
  <h2>DOM = Document Object!</h2>

    <input type="number" name="nota1" id="nota1" min="0" max="10" placeholder="Digite a Nota 1">
    <br><br>
    <input type="number" name="nota2" id="nota2" min="0" max="10" placeholder="Digite a Nota 2">
    <br><br>

    <button id="btnCalcular">Calcular Média</button>

    <h3 id="txtMedia">Média: -</h3>
    <h3 id="txtSituacao">Situação: -</h3>

  <script>

       const campoNota1 = document.getElementById("nota1");
       const campoNota2 = document.getElementById("nota2");
       const botao = document.getElementById("btnCalcular");
       const txtMedia = document.getElementById("txtMedia");
       const txtSituacao = document.getElementById("txtSituacao");

       function processarMedia(){
          const n1 = Number(campoNota1.value);
          const n2 = Number(campoNota2.value);

          const media = (n1 + n2) / 2;

          txtMedia.innerText = `Média: ${media}`;

          if(media >= 7.0){
            txtSituacao.innerText = "Situação: Aprovado(a)";
          }else{
            txtSituacao.innerText = "Situação: Reprovado(a)";
          }
       }

       botao.addEventListener("click", processarMedia);

  </script>
  
</body>
</html>
