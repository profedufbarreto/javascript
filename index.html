<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação de Aluno (POO)</title>

</head>
<body>

    <h2>Conversor de Celsius para Fahrenheit</h2>

    <input type="number" name="campoCelsius" id="campoCelsius" placeholder="Temperatura em °C">
    <br><br>

    <button id="btnTradicional">Converter (Função Normal)</button>

    <button id="btnArrow">Converter (arrow function)</button>

    <h3 id="txtResultado">Resultado: -</h3>
  

<script>

    const campoCelsius = document.getElementById("campoCelsius");
    const btnTradicional = document.getElementById("btnTradicional");
    const btnArrow = document.getElementById("btnArrow");
    const txtResultado = document.getElementById("txtResultado");

    function converterComTradicional(){
      const celsius = Number(campoCelsius.value);
      if(campoCelsius.value === ""){
        txtResultado.innerText = "Digite um valor válido!";
        return;
      }
      const fahrenheit = (celsius * 9 / 5) + 32;
      txtResultado.innerText = `[Tradicional] ${celsius}°C = ${fahrenheit.toFixed(1)}°F`;
    }

    const converterComArrow = () => {
      const celsius = Number(campoCelsius.value);
      if(campoCelsius.value === ""){
        txtResultado.innerText = "Digite um valor válido!";
        return;
      }
      const fahrenheit = (celsius * 9 / 5) + 32;
      txtResultado.innerText = `[Arrow Function] ${celsius}°C = ${fahrenheit.toFixed(1)}°F`;
    };

    btnTradicional.addEventListener("click", converterComTradicional);
    btnArrow.addEventListener("click", converterComArrow);

</script>
</body>
</html>
