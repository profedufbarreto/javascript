<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula 1 - Js Básiso</title>

</head>
<body>

  <h1>Aula 1: Variáveis e tipos de dados</h1>
  <p>Abra o Console (F12) para ver os resultados</p>

  <script>

      async function consultarCep(cep){
        try{
          const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);

          const dados = await resposta.json();

          if(dados.erro){
            console.log("CEP não encontrado.");
            return;
          }

          console.log(`Logradouro: ${dados.logradouro}`);
          console.log(`Bairro: ${dados.bairro}`);
          console.log(`Cidade: ${dados.localidade}/${dados.uf}`);
        
        }catch(erro){
          console.error("Erro ao consultar o CEP: ", erro);
        }
      }

      consultarCep("01001000");

  </script>

  

</body>
</html>
