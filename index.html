<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação de Aluno (POO)</title>

</head>
<body>

    <h2>Operações Matemáticas Rápidas</h2>
    
    <input type="number" id="campoNum" placeholder="Digite um número">
    <br><br>

    <button id="btnDobro">Calcular Dobro</button>
    <button id="btnMetade">Calcular Metade</button>
    <button id="btnQuadrado">Calcular Quadrado</button>

    <h3 id="txtResultado">Resultado: -</h3>

<script>

    const dobro = n => n * 2;
    const metade = n => n / 2;
    const quadrado = n => n * n;

    const campoNum = document.getElementById("campoNum");
    const txtResultado = document.getElementById("txtResultado");

    document.getElementById("btnDobro").addEventListener("click", () => {
      const num = Number(campoNum.value);
      txtResultado.innerText = `O dobro é ${dobro(num)}`;
    });

    document.getElementById("btnMetade").addEventListener("click", () => {
      const num = Number(campoNum.value);
      txtResultado.innerText = `A metade é ${metade(num)}`;
    });

    document.getElementById("btnQuadrado").addEventListener("click", () => {
      const num = Number(campoNum.value);
      txtResultado.innerText = `O quadrado é ${quadrado(num)}`;
    });

</script>
</body>
</html>
