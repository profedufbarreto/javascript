<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula JavaScript - Prática de Eventos DOM</title>

</head>
<body>
  
  <h2>Boas-vindas personalizadas</h2>

  <input type="text" name="campoNome" id="campoNome" placeholder="Digite seu nome">
  <button id="btnEnviar">Confirmar</button>

  <p id="mensagem">Aguardando entrada...</p>

  <script>

      const inputNome = document.getElementById("campoNome");
      const botao = document.getElementById("btnEnviar");
      const textoMensagem = document.getElementById("mensagem");

      botao.addEventListener("click", () => {
        const nomeDigitado = inputNome.value.trim();

        if(nomeDigitado === ""){
          textoMensagem.innerText = "Por favor, informe um nome válido.";
        }else{
          textoMensagem.innerText = `Olá, ${nomeDigitado}! Seja bem-vindo!`;
          inputNome.value = "";
        }
      });

      inputNome.addEventListener("keyup", (event) => {
        if(event.key === "Enter") {
          botao.click();
        }
      });



  </script>
  
</body>
</html>
